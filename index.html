<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página Principal - 3 Cards Animados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Estilos 3D para la animación de 180° horizontal y vertical */
      .perspective {
        perspective: 1000px;
      }
      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.8s;
        transform-style: preserve-3d;
      }
      /* Giro de 180 grados en X e Y al pasar el cursor */
      .perspective:hover .card-inner {
        transform: rotateX(180deg) rotateY(180deg);
      }
      .card-front,
      .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        border-radius: 1rem;
      }
      .card-back {
        /* Rotado por defecto para mostrarse al dar la vuelta */
        transform: rotateX(180deg) rotateY(180deg);
      }
    </style>
  </head>
  <body
    class="bg-slate-100 min-h-screen flex flex-col justify-center items-center p-6"
  >
    <h1 class="text-3xl font-bold text-slate-800 mb-10 text-center">
      Diseño web con 3 cards animados
    </h1>

    <div class="flex flex-wrap justify-center gap-8">
      <!-- CARD 1 -> page01.html -->
      <a href="page01.html" class="w-64 h-64 perspective">
        <div class="card-inner shadow-xl">
          <!-- Frente -->
          <div
            class="card-front bg-sky-300 flex items-center justify-center border-4 border-sky-200"
          >
            <span class="text-3xl font-bold text-white tracking-wider"
              >page1</span
            >
          </div>
          <!-- Reverso -->
          <div
            class="card-back bg-blue-600 flex flex-col items-center justify-center text-white p-4 text-center"
          >
            <span class="text-xl font-bold">Ir a Page 1</span>
            <p class="text-xs mt-2">Mensajes Inbox</p>
          </div>
        </div>
      </a>

      <!-- CARD 2 -> page02.html -->
      <a href="page02.html" class="w-64 h-64 perspective">
        <div class="card-inner shadow-xl">
          <!-- Frente -->
          <div
            class="card-front bg-sky-300 flex items-center justify-center border-4 border-sky-200"
          >
            <span class="text-3xl font-bold text-white tracking-wider"
              >page2</span
            >
          </div>
          <!-- Reverso -->
          <div
            class="card-back bg-indigo-600 flex flex-col items-center justify-center text-white p-4 text-center"
          >
            <span class="text-xl font-bold">Ir a Page 2</span>
            <p class="text-xs mt-2">Playas y Clima de Perú</p>
          </div>
        </div>
      </a>

      <!-- CARD 3 -> page03.html -->
      <a href="page03.html" class="w-64 h-64 perspective">
        <div class="card-inner shadow-xl">
          <!-- Frente -->
          <div
            class="card-front bg-sky-300 flex items-center justify-center border-4 border-sky-200"
          >
            <span class="text-3xl font-bold text-white tracking-wider"
              >page3</span
            >
          </div>
          <!-- Reverso -->
          <div
            class="card-back bg-teal-600 flex flex-col items-center justify-center text-white p-4 text-center"
          >
            <span class="text-xl font-bold">Ir a Page 3</span>
            <p class="text-xs mt-2">Tienda Plantas</p>
          </div>
        </div>
      </a>
    </div>
  </body>
</html>
